<form data-ai-chat-archive-create-project>
    <p
            data-ai-chat-archive-project-message
            role="status"
            hidden
    ></p>
    <label>
        Название проекта
        <input
                type="text"
                data-ai-chat-archive-project-name
                required
        />
    </label>

    <button
            type="button"
            data-ai-chat-archive-project-back
    >Назад</button>

    <button type="submit">Создать проект</button>
</form>
