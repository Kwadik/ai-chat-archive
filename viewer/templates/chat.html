<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chat.title }}</title>

    <link
            rel="stylesheet"
            href="/static/css/viewer.css"
    >
</head>
<body>
<main>
    <h1>{{ chat.title }}</h1>

    {% for item in messages %}
    <article>
        <h2>{{ item.message.role }}</h2>
        <div>{{ item.html | safe }}</div>
    </article>
    {% endfor %}
</main>

<script src="/static/js/viewer.js"></script>
</body>
</html>
