<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }}</title>

    <link
            rel="stylesheet"
            href="/static/css/viewer.css"
    >
</head>
<body>
<main>
    <h1>{{ project.name }}</h1>

    {% if project.description %}
    <p>{{ project.description }}</p>
    {% endif %}

    {% if chats %}
    <h2>Chats</h2>

    <ul>
        {% for chat in chats %}
        <li>
            <a href="/projects/{{ project.id }}/chats/{{ chat.provider }}/{{ chat.id }}">
                {{ chat.title }}
            </a>
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</main>

<script src="/static/js/viewer.js"></script>
</body>
</html>
